package:
  name: xorg-server
  version: 21.1.15
  epoch: 0
  description: "X Server"
  copyright:
    - license: SGI-B-2.0
  dependencies:
    runtime:
      - dbus
      - dbus-x11
      - font-misc
      - mesa-libgallium
      - systemd
      - ttf-dejavu
      - xkbcomp
      - xkeyboard-config

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - dbus-dev
      - freetype-dev
      - libdrm
      - libdrm-dev
      - libepoxy-dev
      - libfontenc-dev
      - libpciaccess-dev
      - libx11-dev
      - libxcvt-dev
      - libxext-dev
      - libxfixes-dev
      - libxfont-dev
      - libxkbfile-dev
      - libxshmfence-dev
      - libxxf86vm-dev
      - mesa-dev
      - mesa-gbm
      - mesa-glx
      - mesa-libgallium
      - openssl-dev
      - pixman-dev
      - systemd-dev
      - zlib-dev

data:
  - name: bins
    items:
      Xvfb: Virtual Framebuffer 'fake' X server
      Xnest: A nested Xorg server
      gtf: Generate mode timings using the GTF Timing Standard

pipeline:
  - uses: fetch
    with:
      uri: https://www.x.org/releases/individual/xserver/xorg-server-${{package.version}}.tar.xz
      expected-sha256: 841c82901282902725762df03adbbcd68153d4cdfb0d61df0cfd73ad677ae089

  - uses: autoconf/configure
    with:
      opts: |
        --prefix=/usr \
        --with-default-font-path=/usr/share/fonts/misc \
        --with-xkb-path=/usr/share/X11/xkb \
        --enable-xorg \
        --enable-glamor \
        --enable-xnest \
        --enable-xvfb \
        --enable-xcsecurity \
        --enable-suid-wrapper \
        --enable-pciaccess \
        --enable-config-udev \
        --disable-config-hal \
        --enable-systemd-logind \
        --enable-dri \
        --enable-dri2 \
        --enable-dri3 \
        --mandir=/usr/share/man

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - xorg-server

  - range: bins
    name: ${{range.key}}
    description: ${{range.value}}
    pipeline:
      - runs: |
          install -Dm755 "${{targets.destdir}}"/usr/bin/${{range.key}} "${{targets.subpkgdir}}"/usr/bin/${{range.key}}
    dependencies:
      runtime:
        - mesa-libgallium

  - name: xvfb-run
    description: imlib2 dev
    dependencies:
      runtime:
        - coreutils
        - xauth
        - mcookie
    pipeline:
      - uses: git-checkout
        with:
          repository: https://salsa.debian.org/xorg-team/xserver/xorg-server
          tag: debian/2%21.1.15-2
          expected-commit: 4c5d2ac2b36d6da2a5b0f5b87ad90f5409d1532d
        # This repo has a history of not pushing tags, see:
        #   https://github.com/wolfi-dev/os/pull/13691#issue-2154225731
        # But the subtree of code we use rarely changes. The following
        # is meant as a trip-wire to detect when it does.
        #
        # - If the detected changes are in a tagged release, simply bump the
        #   above tag/commit.
        # - If the changes were released but the tag was not pushed,
        #   add a 'cherry-picks: <tag>..<hash-missing-tag>' to the above so
        #   that the test below passes. Please remind upstream to push the tag.
        # - If the changes were not released yet, decide if you think we
        #   should pull them.
        #   - If yes, cherry-pick them above and below.
        #   - If no, you can make this test pass by adding a patch to the
        #     checkout below that reverts those changes. In that case, please
        #     also add an expected-commit for the branch below so we will
        #     notice when it moves forward.
      - uses: git-checkout
        with:
          repository: https://salsa.debian.org/xorg-team/xserver/xorg-server
          branch: debian-unstable
          destination: debian-freshness-check
      - runs: |
          if diff -urpN debian/local debian-freshness-check/debian/local; then
            # The code we use hasn't changed
            exit 0
          fi
          if diff -u debian/changelog debian-freshness-check/debian/changelog; then
            # There are changes, but they are still pending release.
            exit 0
          fi
          echo "*** Possible missing upstream tag. Please see the code block in xorg-server.yaml for how to proceed ***"
          exit 1

      - working-directory: debian/local
        pipeline:
          - runs: |
              install -Dm755 xvfb-run "${{targets.subpkgdir}}"/usr/bin/xvfb-run
              install -D xvfb-run.1 "${{targets.subpkgdir}}"/usr/share/man/man1/xvfb-run.1
    test:
      pipeline:
        - runs: |
            xvfb-run --help

  - name: ${{package.name}}-common
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/xorg
          mv ${{targets.destdir}}/usr/lib/xorg/protocol.txt ${{targets.subpkgdir}}/usr/lib/xorg/

update:
  enabled: true
  release-monitor:
    identifier: 5250

test:
  pipeline:
    - uses: test/ldd-check
      with:
        packages: ${{package.name}}
