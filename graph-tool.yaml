package:
  name: graph-tool
  version: 2.97
  epoch: 0
  description: graph-tool is an efficient Python module for manipulation and statistical analysis of graphs (a.k.a. networks).
  copyright:
    - license: GPL-3.0-only

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bash
      - boost-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cgal-dev
      - expat-dev
      - gmp-dev
      - libtool
      - pkgconf-dev
      - python3-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.skewed.de/count0/graph-tool
      tag: release-${{package.version}}
      expected-commit: cd15650ec9fb6807b4536b523a059354f231fcb1

  - runs: |
      ./autogen.sh
      CXXFLAGS=${CXXFLAGS/-Wp,-D_GLIBCXX_ASSERTIONS/}
      export CXXFLAGS="$CXXFLAGS -O3"

  - uses: autoconf/configure
    with:
      opts: |
        --enable-openmp

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages

  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
