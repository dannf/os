package:
  name: mm-common
  version: 1.0.6
  epoch: 0
  description: This module is part of the GNOME C++ bindings
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - wget

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.gnome.org/GNOME/mm-common
      expected-commit: 7d50a613306499f525033498ea922e3887ed7e9a
      tag: ${{package.version}}

  - uses: meson/configure
    with:
      opts: |
        -Duse-network=true

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages

  - name: ${{package.name}}-dev
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/ldd-check
