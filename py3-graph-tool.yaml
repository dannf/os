package:
  name: py3-graph-tool
  version: 2.97
  epoch: 0
  description: graph-tool is an efficient Python module for manipulation and statistical analysis of graphs (a.k.a. networks).
  dependencies:
    provides:
      - graph-tool=${{package.full-version}}
    runtime:
      - py3-numpy
      - py3-scipy
  copyright:
    - license: GPL-3.0-only

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bash
      - boost-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cairo-dev
      - cairomm-dev
      - cgal-dev
      - eigen-dev
      - expat-dev
      - freetype-dev
      - gmp-dev
      - libsigcplusplus-dev
      - libtool
      - mpfr-dev
      - pkgconf-dev
      - py3-cairo
      - py3-numpy
      - python3-dev
      - sparsehash-dev
      - zlib-dev
  environment:
    CAIROMM_LIBS: "/usr/lib/cairomm-1.16"
    CAIROMM_CFLAGS: "-Wno-error"

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.skewed.de/count0/graph-tool
      tag: release-${{package.version}}
      expected-commit: cd15650ec9fb6807b4536b523a059354f231fcb1

  - runs: |
      ./autogen.sh
      CXXFLAGS=${CXXFLAGS/-Wp,-D_GLIBCXX_ASSERTIONS/}
      export CXXFLAGS="$CXXFLAGS -O3"

  - runs: |
      cp -r /usr/include/cairo/* /usr/lib/python3.13/site-packages/cairo/include/
      cp -r /usr/include/freetype2/* /usr/lib/python3.13/site-packages/cairo/include/

  - uses: autoconf/configure
    with:
      opts: |
        --enable-openmp \
        --includedir=/usr/lib/cairomm-1.16

  - runs: |
      ln -s /usr/lib/cairomm-1.16/include/cairommconfig.h /usr/include/cairommconfig.h
      ln -s /usr/include/cairomm-1.16/cairomm/ /usr/include/cairomm
      ln -s /usr/lib/sigc++-3.0/include/sigc++config.h /usr/include/sigc++config.h
      ln -s /usr/include/sigc++-3.0/sigc++/ /usr/include/sigc++
      export CPPFLAGS="$CPPFLAGS -I/usr/lib/cairomm-1.16/include -I/usr/include/cairomm-1.16/cairomm/ -I/usr/include/sigc++-3.0/sigc++/"
      make -C . -j$(nproc) V=1

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/share
          mv "${{targets.destdir}}"/usr/share/doc "${{targets.contextdir}}"/usr/share/
    description: ${{package.name}} manpages
    test:
      pipeline:
        - uses: test/docs

  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  git:
    strip-prefix: release-
